<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 430" data-graphic-id="cusa-transsumptio-ascent" role="img" aria-label="De Docta Ignorantia I.12 — Three-Step Method of Mathematical Transsumption">
  <title>De Docta Ignorantia I.12 — Three-Step Method of Mathematical Transsumption</title>
