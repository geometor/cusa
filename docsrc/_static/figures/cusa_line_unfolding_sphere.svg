      <path class="geom-line carrier-line harmonic-line" d="M 153.6 250 L 320 250 L 486.4 250" data-ref="[ D B ]" data-aliases="[ A B ] | [ B A ] | / A B / | [ A D ] | [ D A ] | / A D / | [ B D ] | / B D /" fill="none"><title>[ D B ]: (0)*x + (1)*y + (0) = 0</title></path>
      <path class="geom-line pappus-line pappus-even" d="M 320 250 L 361.6 177.95 L 403.2 105.89" data-ref="[ A C ]" data-aliases="[ C A ] | / A C /" fill="none"><title>[ A C ]: (-sqrt(3)/2)*x + (1/2)*y + (0) = 0</title></path>
      <path class="geom-line pappus-line pappus-odd" d="M 486.4 250 L 444.8 177.95 L 403.2 105.89" data-ref="[ B C ]" data-aliases="[ C B ] | / B C /" fill="none"><title>[ B C ]: (-sqrt(3)/2)*x + (-1/2)*y + (sqrt(3)/2) = 0</title></path>
