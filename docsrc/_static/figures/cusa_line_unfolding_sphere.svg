<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 640 500" data-graphic-id="cusa-line-unfolding-sphere" role="img" aria-label="De Docta Ignorantia I.13, I.15, I.23 — Generative Unfolding of Line, Triangle, Circle &amp; Sphere">
  <title>De Docta Ignorantia I.13, I.15, I.23 — Generative Unfolding of Line, Triangle, Circle &amp; Sphere</title>
